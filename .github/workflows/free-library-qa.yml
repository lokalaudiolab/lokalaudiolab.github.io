name: Free Sound Library browser QA

on:
  push:
    branches: [main]
    paths:
      - free-library.js
      - index.html
      - styles.css
      - site_library_sync.py
      - tests/**
      - .github/workflows/free-library-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax and safe catalog importer
        run: |
          node --check free-library.js
          node --check app.js
          node --check tests/browser-free-library.cjs
          python3 -m unittest discover -s tests -p 'test_site_library_sync.py' -v
      - name: Install browser test driver
        run: |
          command -v google-chrome || command -v chromium
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Test WAV player and dynamic free catalog in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lal-site.log 2>&1 &
          node tests/browser-free-library.cjs
